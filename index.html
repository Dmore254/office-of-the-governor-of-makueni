<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Makueni County Government | Careers & Job Applications</title>
<meta name="description" content="Apply for job vacancies at the County Government of Makueni. Pay the application fee securely via M-Pesa and submit your application online." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============ TOKENS ============ */
:root{
  --green-900:#08301f;
  --green-800:#0c4530;
  --green-700:#106044;
  --green-600:#157a56;
  --green-500:#1a9769;
  --green-100:#e2f4ec;
  --green-50:#f1faf6;
  --gold:#f0b429;
  --gold-dark:#cf9700;
  --gold-soft:#fff6e0;

  --ink:#0c1a15;
  --body:#41544c;
  --muted:#75877f;
  --line:#e3ebe7;
  --bg:#f4f8f6;
  --white:#ffffff;

  --r-sm:10px;
  --r-md:14px;
  --r-lg:20px;
  --r-xl:28px;

  --sh-sm:0 1px 2px rgba(8,48,31,.05), 0 2px 10px rgba(8,48,31,.05);
  --sh-md:0 4px 12px rgba(8,48,31,.07), 0 12px 32px -8px rgba(8,48,31,.12);
  --sh-lg:0 30px 70px -18px rgba(8,48,31,.35);

  --ease:cubic-bezier(.22,.75,.28,1);
}

/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;color:var(--ink);line-height:1.18;letter-spacing:-.02em;font-weight:800;}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;}
img{max-width:100%;display:block;}
ul{margin:0;padding:0;list-style:none;}

.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto;}

/* ============ TOP BAR ============ */
.topbar{
  background:var(--green-900);
  color:rgba(255,255,255,.82);
  font-size:12.5px;
  letter-spacing:.01em;
}
.topbar .wrap{
  display:flex;align-items:center;justify-content:space-between;
  gap:1rem;min-height:38px;padding-block:.35rem;
}
.topbar__list{display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap;}
.topbar__list li{display:flex;align-items:center;gap:.45rem;}
.topbar__list svg{width:14px;height:14px;stroke:var(--gold);flex:none;}
.topbar__badge{
  display:inline-flex;align-items:center;gap:.4rem;
  background:rgba(240,180,41,.14);
  border:1px solid rgba(240,180,41,.3);
  color:var(--gold);
  padding:.2rem .6rem;border-radius:99px;
  font-weight:600;font-size:11.5px;
}
@media(max-width:860px){
  .topbar__list li:not(:first-child){display:none;}
}

/* ============ NAV ============ */
.nav{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav__inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:1rem;min-height:72px;
}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0;}
.brand__mark{
  width:44px;height:44px;flex:none;border-radius:13px;
  background:linear-gradient(150deg,var(--green-600),var(--green-800));
  display:grid;place-items:center;
  box-shadow:0 6px 16px -6px rgba(16,96,68,.6);
  position:relative;overflow:hidden;
}
.brand__mark::after{
  content:"";position:absolute;inset:auto -30% -60% -30%;height:70%;
  background:radial-gradient(ellipse at 50% 0%,rgba(240,180,41,.55),transparent 70%);
}
.brand__mark span{
  color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em;position:relative;
}
.brand__text{min-width:0;}
.brand__text strong{
  display:block;color:var(--ink);font-weight:800;font-size:15.5px;letter-spacing:-.02em;
  white-space:nowrap;
}
.brand__text small{
  display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;
}
.nav__links{display:flex;align-items:center;gap:.35rem;}
.nav__links a{
  padding:.55rem .9rem;border-radius:99px;
  font-size:14px;font-weight:600;color:var(--body);
  transition:background .2s var(--ease),color .2s var(--ease);
}
.nav__links a:hover{background:var(--green-50);color:var(--green-700);}
.nav__cta{
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--green-700);color:#fff!important;
  padding:.65rem 1.15rem;border-radius:99px;
  font-weight:700;font-size:13.5px;
  box-shadow:0 8px 20px -10px rgba(16,96,68,.9);
  transition:transform .2s var(--ease),background .2s var(--ease);
}
.nav__cta:hover{background:var(--green-800);transform:translateY(-1px);}
.nav__toggle{
  display:none;width:42px;height:42px;border-radius:12px;
  border:1px solid var(--line);background:#fff;
  place-items:center;
}
.nav__toggle span{
  display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;
  position:relative;transition:.25s var(--ease);
}
.nav__toggle span::before,.nav__toggle span::after{
  content:"";position:absolute;left:0;width:18px;height:2px;background:var(--ink);border-radius:2px;
  transition:.25s var(--ease);
}
.nav__toggle span::before{top:-6px;}
.nav__toggle span::after{top:6px;}
.nav__toggle.is-open span{background:transparent;}
.nav__toggle.is-open span::before{top:0;transform:rotate(45deg);}
.nav__toggle.is-open span::after{top:0;transform:rotate(-45deg);}

@media(max-width:900px){
  .nav__toggle{display:grid;}
  .nav__links{
    position:absolute;top:100%;left:0;right:0;
    flex-direction:column;align-items:stretch;gap:.25rem;
    background:#fff;border-bottom:1px solid var(--line);
    padding:1rem 1.25rem 1.5rem;
    box-shadow:var(--sh-md);
    display:none;
  }
  .nav__links.is-open{display:flex;}
  .nav__links a{padding:.8rem 1rem;border-radius:12px;}
  .nav__cta{justify-content:center;margin-top:.4rem;}
}

/* ============ HERO ============ */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(120% 90% at 85% -10%, rgba(240,180,41,.22), transparent 55%),
    linear-gradient(160deg,var(--green-900) 0%, var(--green-800) 45%, var(--green-700) 100%);
  color:#fff;
  padding:clamp(3rem,7vw,5.5rem) 0 clamp(3.5rem,8vw,6rem);
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(80% 70% at 50% 20%,#000 20%,transparent 100%);
  -webkit-mask-image:radial-gradient(80% 70% at 50% 20%,#000 20%,transparent 100%);
  pointer-events:none;
}
.hero::after{
  content:"";position:absolute;width:520px;height:520px;border-radius:50%;
  right:-190px;bottom:-260px;
  background:radial-gradient(circle,rgba(26,151,105,.5),transparent 65%);
  pointer-events:none;
}
.hero__inner{position:relative;z-index:2;max-width:760px;}
.hero__tag{
  display:inline-flex;align-items:center;gap:.55rem;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  padding:.4rem .9rem;border-radius:99px;
  font-size:12.5px;font-weight:600;letter-spacing:.04em;
  color:#d9f2e6;margin-bottom:1.4rem;
  backdrop-filter:blur(6px);
}
.hero__tag i{
  width:7px;height:7px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 4px rgba(240,180,41,.22);
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 4px rgba(240,180,41,.22);}
  50%{box-shadow:0 0 0 8px rgba(240,180,41,.05);}
}
.hero h1{
  color:#fff;font-size:clamp(1.9rem,5vw,3.1rem);letter-spacing:-.035em;
  margin-bottom:1rem;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(100deg,var(--gold),#ffd873);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{
  color:rgba(255,255,255,.78);font-size:clamp(.95rem,1.6vw,1.08rem);
  max-width:600px;margin-bottom:2rem;
}
.hero__actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:2.6rem;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.85rem 1.5rem;border-radius:99px;
  font-weight:700;font-size:14.5px;
  transition:transform .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease);
  white-space:nowrap;
}
.btn svg{width:17px;height:17px;flex:none;}
.btn--gold{
  background:linear-gradient(135deg,var(--gold),#ffd05e);
  color:#3a2a00;
  box-shadow:0 14px 30px -12px rgba(240,180,41,.85);
}
.btn--gold:hover{transform:translateY(-2px);box-shadow:0 18px 36px -12px rgba(240,180,41,.95);}
.btn--ghost{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.24);
  color:#fff;
  backdrop-filter:blur(6px);
}
.btn--ghost:hover{background:rgba(255,255,255,.16);transform:translateY(-2px);}
.btn--primary{
  background:var(--green-700);color:#fff;
  box-shadow:0 12px 26px -12px rgba(16,96,68,.9);
}
.btn--primary:hover{background:var(--green-800);transform:translateY(-2px);}
.btn--outline{
  background:#fff;border:1px solid var(--line);color:var(--ink);
}
.btn--outline:hover{border-color:var(--green-500);color:var(--green-700);}
.btn--block{width:100%;}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important;box-shadow:none;}

.hero__stats{
  display:flex;flex-wrap:wrap;gap:clamp(1.2rem,4vw,3rem);
  padding-top:1.8rem;border-top:1px solid rgba(255,255,255,.14);
}
.hero__stat strong{
  display:block;font-size:clamp(1.35rem,3vw,1.75rem);color:#fff;font-weight:800;
  letter-spacing:-.03em;
}
.hero__stat span{
  font-size:12.5px;color:rgba(255,255,255,.62);font-weight:500;
}

/* ============ SECTION ============ */
.section{padding:clamp(2.8rem,6vw,4.5rem) 0;}
.section__head{
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:1.2rem;margin-bottom:2rem;
}
.section__head h2{font-size:clamp(1.4rem,3.2vw,2rem);}
.section__head p{color:var(--muted);font-size:14.5px;margin-top:.4rem;max-width:520px;}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5rem;
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--green-600);margin-bottom:.6rem;
}
.eyebrow::before{
  content:"";width:22px;height:2px;border-radius:2px;background:var(--gold);
}

/* ============ TOOLBAR ============ */
.toolbar{
  display:flex;flex-wrap:wrap;gap:1rem;align-items:center;
  justify-content:space-between;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  padding:.9rem 1rem;box-shadow:var(--sh-sm);margin-bottom:1.6rem;
}
.search{
  position:relative;flex:1 1 260px;min-width:220px;
}
.search svg{
  position:absolute;left:.95rem;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--muted);pointer-events:none;
}
.search input{
  width:100%;padding:.75rem 1rem .75rem 2.7rem;
  border:1px solid var(--line);border-radius:99px;
  background:var(--bg);outline:none;font-size:14px;
  transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease);
}
.search input::placeholder{color:var(--muted);}
.search input:focus{
  border-color:var(--green-500);background:#fff;
  box-shadow:0 0 0 4px rgba(26,151,105,.12);
}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;}
.chip{
  padding:.5rem .95rem;border-radius:99px;
  font-size:13px;font-weight:600;color:var(--body);
  background:var(--bg);border:1px solid transparent;
  transition:.2s var(--ease);
}
.chip:hover{background:var(--green-50);color:var(--green-700);}
.chip.is-active{
  background:var(--green-700);color:#fff;
  box-shadow:0 8px 18px -10px rgba(16,96,68,.9);
}
@media(max-width:640px){
  .toolbar{flex-direction:column;align-items:stretch;}
  .chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:.25rem;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;}
}

/* ============ JOB CARDS ============ */
.jobs{
  display:grid;gap:1.1rem;
  grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
}
.job{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.4rem;display:flex;flex-direction:column;gap:.9rem;
  box-shadow:var(--sh-sm);position:relative;overflow:hidden;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease);
}
.job::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--green-500),var(--gold));
  transform:scaleX(0);transform-origin:left;
  transition:transform .35s var(--ease);
}
.job:hover{transform:translateY(-4px);box-shadow:var(--sh-md);border-color:#d3e3db;}
.job:hover::before{transform:scaleX(1);}
.job__top{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start;}
.job__dept{
  font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--green-600);
}
.job__title{font-size:1.08rem;margin-top:.3rem;letter-spacing:-.025em;}
.job__fee{
  flex:none;text-align:right;
  background:var(--gold-soft);border:1px solid #ffe6ad;
  border-radius:var(--r-sm);padding:.4rem .6rem;
}
.job__fee small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dark);}
.job__fee strong{display:block;font-size:13.5px;color:#7a5600;font-weight:800;line-height:1.2;}
.job__meta{display:flex;flex-wrap:wrap;gap:.4rem;}
.pill{
  display:inline-flex;align-items:center;gap:.35rem;
  font-size:12px;font-weight:600;color:var(--body);
  background:var(--bg);border-radius:99px;padding:.32rem .7rem;
}
.pill svg{width:13px;height:13px;stroke:var(--green-600);flex:none;}
.job__desc{font-size:13.6px;color:var(--muted);line-height:1.65;}
.job__foot{
  display:flex;align-items:center;justify-content:space-between;gap:.8rem;
  margin-top:auto;padding-top:1rem;border-top:1px dashed var(--line);
}
.job__deadline{font-size:12.3px;color:var(--muted);}
.job__deadline b{color:var(--ink);font-weight:700;}
.job__apply{
  display:inline-flex;align-items:center;gap:.45rem;
  background:var(--green-700);color:#fff;
  padding:.62rem 1.05rem;border-radius:99px;
  font-size:13.3px;font-weight:700;
  transition:.22s var(--ease);
}
.job__apply svg{width:15px;height:15px;}
.job__apply:hover{background:var(--green-800);transform:translateX(2px);}

.empty{
  grid-column:1/-1;text-align:center;padding:3.5rem 1rem;
  background:#fff;border:1px dashed var(--line);border-radius:var(--r-lg);
}
.empty h3{font-size:1.05rem;margin-bottom:.4rem;}
.empty p{color:var(--muted);font-size:14px;}

/* ============ STEPS ============ */
.how{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.steps-grid{
  display:grid;gap:1.1rem;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  counter-reset:step;
}
.step-card{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.5rem 1.3rem;position:relative;
  transition:.25s var(--ease);
}
.step-card:hover{background:#fff;box-shadow:var(--sh-md);transform:translateY(-3px);}
.step-card__num{
  counter-increment:step;
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(150deg,var(--green-600),var(--green-800));
  color:#fff;font-weight:800;font-size:15px;
  display:grid;place-items:center;margin-bottom:1rem;
  box-shadow:0 8px 18px -10px rgba(16,96,68,.9);
}
.step-card__num::before{content:"0" counter(step);}
.step-card h3{font-size:1rem;margin-bottom:.45rem;}
.step-card p{font-size:13.6px;color:var(--muted);line-height:1.65;}

/* ============ NOTICE ============ */
.notice{
  display:flex;gap:1rem;align-items:flex-start;
  background:linear-gradient(120deg,var(--green-50),#fff);
  border:1px solid #cfe9dd;border-left:4px solid var(--green-500);
  border-radius:var(--r-md);padding:1.1rem 1.2rem;margin-top:2rem;
}
.notice svg{width:20px;height:20px;stroke:var(--green-600);flex:none;margin-top:2px;}
.notice h4{font-size:14px;margin-bottom:.2rem;}
.notice p{font-size:13.3px;color:var(--muted);}

/* ============ FOOTER ============ */
.footer{
  background:var(--green-900);color:rgba(255,255,255,.7);
  padding:3rem 0 1.6rem;font-size:13.6px;
}
.footer__grid{
  display:grid;gap:2rem;
  grid-template-columns:1.6fr 1fr 1fr 1.2fr;
  padding-bottom:2.2rem;border-bottom:1px solid rgba(255,255,255,.1);
}
.footer h4{color:#fff;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1rem;}
.footer__brand{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;}
.footer__brand .brand__mark{width:40px;height:40px;border-radius:12px;}
.footer__brand strong{color:#fff;font-size:15px;font-weight:800;}
.footer ul li{margin-bottom:.6rem;}
.footer ul a{transition:color .2s var(--ease);}
.footer ul a:hover{color:var(--gold);}
.footer__bottom{
  display:flex;flex-wrap:wrap;gap:.8rem;justify-content:space-between;align-items:center;
  padding-top:1.4rem;font-size:12.6px;color:rgba(255,255,255,.5);
}
@media(max-width:820px){
  .footer__grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:520px){
  .footer__grid{grid-template-columns:1fr;}
}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:1.25rem;
  visibility:hidden;opacity:0;
  transition:opacity .25s var(--ease),visibility .25s;
}
.modal.is-open{visibility:visible;opacity:1;}
.modal__backdrop{
  position:absolute;inset:0;
  background:rgba(6,32,21,.6);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.modal__card{
  position:relative;z-index:1;
  width:min(620px,100%);
  max-height:min(92vh,880px);
  background:#fff;border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(18px) scale(.97);
  transition:transform .32s var(--ease);
}
.modal.is-open .modal__card{transform:translateY(0) scale(1);}

.modal__head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;
  padding:1.3rem 1.4rem 1.1rem;
  background:linear-gradient(150deg,var(--green-800),var(--green-700));
  color:#fff;position:relative;overflow:hidden;
}
.modal__head::after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  right:-90px;top:-130px;background:radial-gradient(circle,rgba(240,180,41,.32),transparent 65%);
}
.modal__eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin-bottom:.35rem;position:relative;
}
.modal__title{color:#fff;font-size:1.12rem;letter-spacing:-.025em;position:relative;padding-right:.5rem;}
.modal__close{
  position:relative;flex:none;
  width:36px;height:36px;border-radius:11px;
  background:rgba(255,255,255,.12);
  display:grid;place-items:center;
  transition:background .2s var(--ease);
}
.modal__close:hover{background:rgba(255,255,255,.24);}
.modal__close svg{width:17px;height:17px;stroke:#fff;}

/* stepper */
.stepper{
  display:flex;align-items:center;gap:.5rem;
  padding:.95rem 1.4rem;background:var(--green-50);
  border-bottom:1px solid var(--line);
}
.stepper__item{
  display:flex;align-items:center;gap:.5rem;
  font-size:12.3px;font-weight:700;color:var(--muted);
